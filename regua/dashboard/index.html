<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Régua — painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#0E1626; --panel-2:#16213A; --panel-3:#1D2B49; --grid:#25355A;
  --panel-text:#DCE3F0; --panel-muted:#7E8DAD;
  --cool:#2FBF87; --warm:#E8A33D; --hot:#E8503F; --neutral:#8593B0;
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#0A101C;color:var(--panel-text);font-family:var(--mono);
     -webkit-font-smoothing:antialiased;padding:26px 0 60px}
.wide{max-width:1180px;margin:0 auto;padding:0 22px}
svg{display:block;max-width:100%}

.masthead{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.masthead h1{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;color:#fff}
.masthead span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--panel-muted)}

.dash{background:var(--panel);border:1px solid var(--grid);border-radius:4px;overflow:hidden;
      box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;
         border-bottom:1px solid var(--grid);background:var(--panel-2)}
.tb-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--panel-muted)}
.pill{display:flex;background:var(--panel);border:1px solid var(--grid);border-radius:3px;overflow:hidden}
.pill button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:7px 13px;
             background:transparent;border:0;color:var(--panel-muted);cursor:pointer;transition:.16s}
.pill button:hover{color:var(--panel-text)}
.pill button[aria-pressed="true"]{background:var(--panel-3);color:#fff}
.pill button:focus-visible{outline:2px solid var(--warm);outline-offset:-2px}
select{font-family:var(--mono);font-size:12px;color:#fff;background:var(--panel);
       border:1px solid var(--grid);padding:7px 12px;border-radius:3px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:11px;color:var(--panel-muted)}
.badge{padding:4px 9px;border-radius:3px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.badge.ok{background:rgba(47,191,135,.15);color:var(--cool)}
.badge.low{background:rgba(232,80,63,.15);color:var(--hot)}

.dash-body{display:grid;grid-template-columns:1fr 268px;gap:1px;background:var(--grid)}
@media(max-width:900px){.dash-body{grid-template-columns:1fr}}
.panel-a,.panel-b{background:var(--panel);padding:20px 18px}
.panel-t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--panel-muted);
         margin-bottom:16px;display:flex;justify-content:space-between;gap:10px}
.legend{display:flex;gap:12px;font-size:9px;letter-spacing:.06em;color:var(--panel-muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.heat{display:flex;flex-direction:column;gap:2px}
.heat-b{position:relative;border-radius:2px;padding:5px 9px;cursor:pointer;overflow:hidden;
        display:flex;justify-content:space-between;align-items:center;gap:8px;
        font-size:10.5px;color:#0E1626;transition:.16s;border:1px solid transparent}
.heat-b:hover{filter:brightness(1.12)}
.heat-b[data-sel="1"]{border-color:#fff;box-shadow:0 0 0 1px #fff}
.heat-b .hn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat-b .hv{font-weight:700;font-variant-numeric:tabular-nums;opacity:.82}
.heat-b:focus-visible{outline:2px solid #fff;outline-offset:1px}

.tbl-wrap{background:var(--panel);border-top:1px solid var(--grid);overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
table.tbl th{text-align:right;font-weight:400;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
             color:var(--panel-muted);padding:12px 14px;border-bottom:1px solid var(--grid);white-space:nowrap}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl td{padding:10px 14px;text-align:right;border-bottom:1px solid rgba(37,53,90,.45);font-variant-numeric:tabular-nums}
table.tbl tbody tr{cursor:pointer;transition:background .14s}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl tbody tr[data-sel="1"]{background:var(--panel-3)}
table.tbl tbody tr[data-sel="1"] td:first-child{box-shadow:inset 3px 0 0 var(--warm)}
.bname{color:#fff}
.bidx{color:var(--panel-muted);margin-right:8px}
.chip{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;
      margin-left:8px;background:rgba(133,147,176,.18);color:var(--panel-muted)}

.diag{background:var(--panel-2);border-top:1px solid var(--grid);padding:22px 18px;
      display:grid;grid-template-columns:1fr 300px;gap:26px}
@media(max-width:820px){.diag{grid-template-columns:1fr}}
.verdict{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.verdict b{font-family:var(--display);font-size:22px;letter-spacing:.01em;text-transform:uppercase}
.verdict .vb{font-size:12px;color:#fff}
.diag p{font-size:13px;line-height:1.65;color:#A9B6D0;margin:0 0 12px}
.diag .act{font-size:12px;color:#fff;border-left:2px solid var(--warm);padding-left:12px;line-height:1.6}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--grid);border:1px solid var(--grid);align-self:start}
.mini div{background:var(--panel);padding:12px}
.mini span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--panel-muted);margin-bottom:5px}
.mini b{font-size:19px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.mini i{font-style:normal;font-size:10px;color:var(--panel-muted);margin-left:4px}
.cmp-note{background:rgba(47,191,135,.09);border-top:1px solid var(--grid);padding:14px 18px;
          font-size:12px;color:#8FD9BA;line-height:1.65}
.cmp-note b{color:#fff}
.warnbar{background:rgba(232,80,63,.1);border-top:1px solid var(--grid);padding:12px 18px;
         font-size:11.5px;color:#F0A79B;line-height:1.6}
.foot-note{text-align:center;font-size:11px;color:#5F6E8E;margin-top:18px;letter-spacing:.05em}

.empty{background:var(--panel);border:1px solid var(--grid);border-radius:4px;padding:40px}
.empty h2{font-family:var(--display);color:#fff;font-size:22px;margin:0 0 12px}
.empty p{font-size:13px;line-height:1.7;color:var(--panel-muted);max-width:62ch}
.empty pre{background:#0A101C;border:1px solid var(--grid);padding:16px;overflow-x:auto;
           font-size:12px;line-height:1.7;color:var(--panel-text);border-radius:3px}
.empty code{color:var(--warm)}
</style>
</head>
<body>
<div class="wide">
  <div class="masthead">
    <h1>Régua</h1>
    <span>mapa de retenção</span>
  </div>
  <div id="root"></div>
  <p class="foot-note" id="footNote"></p>
</div>
<script src="/dashboard/app.js" type="module"></script>
</body>
</html>
